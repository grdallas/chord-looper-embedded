<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Looper — Embed</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>

  :root {
    --paper: #f5f0e8;
    --paper-dark: #ece4d0;
    --ink: #1a1510;
    --ink-light: #3d2e1e;
    --ink-muted: #7a6a56;
    --border: #c8b89a;
    --amber: #c8841a;
    --green: #1a5c2a;
    --green-light: rgba(26, 92, 42, 0.08);
    --active-bg: #fff9f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Libre Baskerville', serif;
    min-height: 100vh;
    padding: 32px 16px 48px;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(200,132,26,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 90%, rgba(139,32,32,0.03) 0%, transparent 50%),
      var(--paper);
  }

  .app {
    max-width: 680px;
    margin: 0 auto;
  }

  /* HEADER */
  header {
    margin-bottom: 32px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  header h1 em {
    font-style: italic;
    color: var(--amber);
  }

  .header-sub {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  /* CONTROLS BAR */
  .controls-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .ctrl-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  .chord-count-btns {
    display: flex;
    gap: 4px;
  }

  .count-btn {
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    background: var(--paper);
    border-radius: 4px;
    font-family: 'Libre Baskerville', serif;
    font-size: 0.8rem;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .count-btn.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* CHORD FILTER BUTTONS */
  .chord-filter-btn {
    padding: 10px 18px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    color: var(--ink-muted);
    font-family: 'Libre Baskerville', serif;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
  }

  .chord-filter-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .chord-filter-btn.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .count-btn:hover:not(.active) {
    border-color: var(--ink);
    color: var(--ink);
  }

  /* PLAYBACK BAR */
  .playback-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    padding: 12px 16px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
  }

  .btn-play-stop {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: transparent;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    flex-shrink: 0;
  }

  .btn-play-stop:hover {
    background: var(--ink);
    color: var(--paper);
  }

  .btn-play-stop.playing {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--ink);
  }

  .btn-metronome {
    width: 40px;
    height: 40px;
    padding: 0;
    background: transparent;
    border: 2px solid var(--ink);
    border-radius: 4px;
    color: var(--ink-muted);
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-metronome:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .btn-metronome.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .tempo-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }

  .tempo-label {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  .tempo-step-btn {
    width: 28px;
    height: 28px;
    border: 1.5px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    font-size: 1.05rem;
    line-height: 1;
    cursor: pointer;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .tempo-step-btn:hover { border-color: var(--ink); }

  input[type="number"].tempo-input {
    width: 58px;
    padding: 5px 6px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    font-size: 0.85rem;
    text-align: center;
    color: var(--ink);
    background: var(--paper);
    -moz-appearance: textfield;
  }
  input[type="number"].tempo-input::-webkit-outer-spin-button,
  input[type="number"].tempo-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"].tempo-input:focus {
    outline: none;
    border-color: var(--ink);
  }

  .tempo-bpm-label {
    font-size: 0.72rem;
    color: var(--ink-muted);
  }

  /* Shared style for typed-text inputs (AI prompt box, typed chord entry) —
     a stronger border and a clear focus glow so they read unmistakably as
     "type here" rather than a static label at a glance. */
  .text-input-field {
    padding: 7px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--paper);
  }
  .text-input-field::placeholder {
    color: var(--ink-muted);
    font-style: italic;
  }
  .text-input-field:focus {
    outline: none;
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(200, 132, 26, 0.15);
  }

  /* CHORD GRID */
  .chord-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }

  @media (max-width: 480px) {
    .chord-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .chord-card {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 16px 12px 14px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    position: relative;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    user-select: none;
  }

  .chord-card:hover {
    border-color: var(--amber);
    background: var(--active-bg);
    transform: translateY(-2px);
  }

  .chord-card.active {
    border-color: var(--amber);
    background: var(--active-bg);
    box-shadow: 0 0 0 2px var(--amber);
  }
  
  .chord-card.active::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
    animation: blink 0.5s ease-in-out infinite alternate;
  }

  @keyframes blink {
    from { opacity: 1; }
    to { opacity: 0.3; }
  }

  .chord-number {
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--border);
    position: absolute;
    top: 7px;
    right: 9px;
  }

  .chord-root {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
  }

  .chord-quality {
    font-size: 0.68rem;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
  }

  .chord-card:hover .chord-root,
  .chord-card.active .chord-root {
    color: var(--amber);
  }

  .chord-card.split {
    flex-direction: row;
    padding: 14px 6px;
    gap: 0;
  }
  .chord-half {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 0;
  }
  .chord-half:first-child {
    border-right: 1px solid var(--border);
  }
  .chord-half .chord-root {
    font-size: 1.15rem;
  }
  .chord-half .chord-quality {
    font-size: 0.6rem;
  }

  /* HINT */
  .hint {
    font-size: 0.62rem;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 24px;
    letter-spacing: 0.08em;
  }

  /* SAVE BAR */
  .save-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .btn-save {
    padding: 10px 20px;
    background: transparent;
    border: 1.5px solid var(--green);
    border-radius: 4px;
    color: var(--green);
    font-family: 'Libre Baskerville', serif;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
  }

  .btn-save:hover {
    background: var(--green-light);
  }

  .btn-save:active {
    background: var(--green);
    color: white;
  }

  .save-flash {
    font-size: 0.65rem;
    color: var(--green);
    opacity: 0;
    transition: opacity 0.3s;
    letter-spacing: 0.08em;
  }

  .save-flash.show {
    opacity: 1;
  }

  /* SAVED LOG */
  .saved-section {
    border-top: 1px solid var(--border);
    padding-top: 24px;
  }

  .saved-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .saved-title {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .btn-clear-all {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Libre Baskerville', serif;
    transition: color 0.12s;
  }

  .btn-clear-all:hover { color: var(--amber); }

  .saved-empty {
    font-size: 0.72rem;
    color: var(--ink-faint);
    font-style: italic;
    font-family: 'Libre Baskerville', serif;
    padding: 8px 0;
  }

  .saved-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .saved-item {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.12s;
  }

  .saved-item:hover {
    border-color: var(--ink-muted);
  }

  .saved-chords {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .saved-chord-pill {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 8px;
    font-size: 0.7rem;
    color: var(--ink);
    white-space: nowrap;
  }

  .saved-chord-pill .root { font-weight: 500; }
  .saved-chord-pill .quality { color: var(--ink-muted); font-size: 0.62rem; }

  .saved-item-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-load, .btn-delete {
    padding: 4px 10px;
    border-radius: 3px;
    font-family: 'Libre Baskerville', serif;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.12s;
  }

  .btn-load {
    background: transparent;
    border: 1px solid var(--ink-muted);
    color: var(--ink-muted);
  }

  .btn-load:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .btn-delete {
    background: transparent;
    border: 1px solid var(--ink-faint);
    color: var(--ink-faint);
  }

  .btn-delete:hover {
    background: var(--accent-light);
    border-color: var(--amber);
    color: var(--amber);
  }

  .saved-timestamp {
    font-size: 0.58rem;
    color: var(--ink-faint);
    white-space: nowrap;
    align-self: flex-start;
    margin-top: 2px;
  }

  /* ── CHORD PICKER MODAL ─────────────────────────────────────────── */
  .picker-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,21,16,0.55);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .picker-overlay.open { display: flex; }

  .picker-modal {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 680px;
    padding: 20px 20px 36px;
    box-shadow: 0 -8px 40px rgba(26,21,16,0.2);
    max-height: 88vh;
    overflow-y: auto;
  }

  .picker-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .picker-title {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .picker-preview {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--amber);
  }

  .picker-close {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .picker-close:hover { border-color: var(--ink); color: var(--ink); }

  .picker-section-label {
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 14px 0 7px;
  }

  .picker-roots {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
  }

  .picker-root {
    padding: 9px 4px;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: 'Libre Baskerville', serif;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--ink-muted);
    cursor: pointer;
    text-align: center;
    transition: all 0.1s;
  }
  .picker-root:hover { border-color: var(--ink); color: var(--ink); }
  .picker-root.selected { background: var(--amber); border-color: var(--amber); color: white; }

  .picker-qualities {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .picker-quality {
    padding: 9px 4px;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: 'Libre Baskerville', serif;
    font-size: 0.63rem;
    color: var(--ink-muted);
    cursor: pointer;
    text-align: center;
    transition: all 0.1s;
  }
  .picker-quality:hover { border-color: var(--ink); color: var(--ink); }
  .picker-quality.selected { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  .picker-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }

  .btn-picker-random {
    flex: 1;
    padding: 11px;
    background: transparent;
    border: 1.5px solid var(--amber);
    border-radius: 4px;
    color: var(--amber);
    font-family: 'Libre Baskerville', serif;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn-picker-random:hover { background: var(--accent-light); }

  .btn-picker-done {
    flex: 1;
    padding: 11px;
    background: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    color: var(--paper);
    font-family: 'Libre Baskerville', serif;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn-picker-done:hover { background: var(--amber); border-color: var(--amber); }


    /* ── Embed overrides ── */
    body { padding: 0; margin: 0; background: var(--paper); min-height: unset; }
    .app { padding: 0.75rem; max-width: 100%; border: none; box-shadow: none; }
    .controls-bar { margin-bottom: 10px; gap: 6px; flex-wrap: wrap; }
    .playback-bar { margin-bottom: 10px; padding: 8px 10px; gap: 8px; }
    .chord-grid { gap: 4px; }
    .chord-cell { min-height: 56px; font-size: 0.9rem; }
    .chord-filter-btn { font-size: 0.72rem; padding: 4px 8px; }

    </style>
</head>
<body>
<div class="app">

  <div class="controls-bar" style="margin-bottom: 8px; flex-wrap: wrap;">
    <span class="ctrl-label">Generate a Progression</span>
    <div style="display: flex; gap: 8px; flex: 1; min-width: 240px;">
      <input type="text" id="aiProgressionPrompt" class="text-input-field" placeholder="e.g. a minor blues in Bb, rhythm changes bridge, a ii-V-I in three keys..." style="flex: 1;" onkeydown="if(event.key==='Enter') generateProgressionFromPrompt();">
      <button class="chord-filter-btn" id="aiProgressionBtn" onclick="generateProgressionFromPrompt()">Generate</button>
    </div>
  </div>
  <div id="aiProgressionStatus" style="display:none; font-size: 0.72rem; color: var(--ink-muted); font-style: italic; margin-bottom: 16px;"></div>

  <div class="controls-bar">
    <span class="ctrl-label">Bars</span>
    <input type="range" id="barSlider" min="4" max="40" value="8" step="1" style="flex: 1; max-width: 300px; margin: 0 12px;" oninput="setChordCountFromSlider(this.value)">
    <span id="barCount" style="font-size: 0.85rem; color: var(--ink); min-width: 32px; font-weight: 700;">8</span>
  </div>

  <div class="controls-bar" style="margin-bottom: 24px;">
    <span class="ctrl-label">Note Spelling</span>
    <div style="display: flex; gap: 8px;">
      <button class="chord-filter-btn active" id="spellFlatBtn" onclick="setNoteSpelling('flat')">Flats</button>
      <button class="chord-filter-btn" id="spellSharpBtn" onclick="setNoteSpelling('sharp')">Sharps</button>
    </div>
  </div>

  <div class="playback-bar">
    <button class="btn-play-stop" id="btnPlayStop" onclick="togglePlay()">▶</button>
    <div class="tempo-group">
      <span class="tempo-label">Tempo</span>
      <button class="tempo-step-btn" onclick="stepTempo(-1)">−</button>
      <input type="number" class="tempo-input" id="tempoInput" min="20" max="320" value="60" oninput="updateTempoFromInput(this)">
      <span class="tempo-bpm-label">bpm</span>
      <button class="tempo-step-btn" onclick="stepTempo(1)">+</button>
    </div>
    <button class="btn-metronome" id="btnMetronome" onclick="toggleMetronome()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 2 L15 16 L3 16 Z" stroke-linejoin="round"/>
        <line x1="9" y1="6" x2="12" y2="13" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="chord-grid" id="chordGrid"></div>

</div>

<!-- Chord Picker Modal -->
<div class="picker-overlay" id="chordPicker" onclick="handleOverlayClick(event)">
  <div class="picker-modal" onclick="event.stopPropagation()">
    <div class="picker-header">
      <span class="picker-title">Edit Chord</span>
      <span class="picker-preview" id="pickerPreview">—</span>
      <button class="picker-close" onclick="closePicker()">✕</button>
    </div>

    <label class="check-label" style="display:flex; align-items:center; gap:8px; margin-bottom:10px; cursor:pointer; font-size:0.85rem;">
      <input type="checkbox" id="pickerSplitToggle" onchange="pickerToggleSplit(this.checked)">
      Split this bar into 2 chords
    </label>

    <div class="picker-half-tabs" id="pickerHalfTabs" style="display:none; gap:8px; margin-bottom:12px;">
      <button class="chord-filter-btn active" id="pickerHalfBtn1" onclick="pickerSetActiveHalf(1)">1st half</button>
      <button class="chord-filter-btn" id="pickerHalfBtn2" onclick="pickerSetActiveHalf(2)">2nd half</button>
    </div>

    <div class="picker-section-label">Or type it</div>
    <div style="display:flex; gap:8px; margin-bottom:6px;">
      <input type="text" id="pickerTypedChord" class="text-input-field" placeholder="e.g. Cmaj7#11, Bb7b9, Am6/9" style="flex:1;" onkeydown="if(event.key==='Enter') pickerApplyTypedChord();">
      <button class="chord-filter-btn" onclick="pickerApplyTypedChord()">Set</button>
    </div>
    <div id="pickerTypedStatus" style="display:none; font-size:0.68rem; color:var(--ink-muted); font-style:italic; margin-bottom:10px;"></div>

    <div class="picker-section-label">Root</div>
    <div class="picker-roots" id="pickerRoots"></div>

    <div class="picker-section-label">Quality</div>
    <div class="picker-qualities" id="pickerQualities"></div>

    <div class="picker-actions">
      <button class="btn-picker-random" onclick="pickerRandom()">↺ Random</button>
      <button class="btn-picker-done" onclick="closePicker()">Done</button>
    </div>
  </div>
</div>

<script>
const ROOTS = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const ROOTS_FLAT = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const ROOTS_PLAIN = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const QUALITIES = [
  { name: 'Maj',    display: 'maj',     weight: 8, category: 'triad' },
  { name: 'min',    display: 'min',     weight: 8, category: 'triad' },
  { name: '7',      display: 'dom7',    weight: 7, category: '7th' },
  { name: 'Maj7',   display: 'maj7',    weight: 6, category: '7th' },
  { name: 'min7',   display: 'min7',    weight: 6, category: '7th' },
  { name: 'ø7',     display: 'ø7',      weight: 3, category: '7th' },
  { name: 'dim7',   display: 'dim7',    weight: 2, category: '7th' },
  { name: 'mMaj7',  display: 'mMaj7',   weight: 2, category: '7th' },
  { name: 'Maj7♯11',display: 'Maj7♯11', weight: 2, category: '7th' },
  { name: '9',      display: 'dom9',    weight: 3, category: 'extended' },
  { name: 'Maj9',   display: 'maj9',    weight: 3, category: 'extended' },
  { name: 'min9',   display: 'min9',    weight: 3, category: 'extended' },
  { name: 'Aug',    display: 'aug',     weight: 1, category: 'triad' },
  { name: 'Sus4',   display: 'sus4',    weight: 2, category: 'triad' },
  { name: 'Sus2',   display: 'sus2',    weight: 2, category: 'triad' },
  { name: '13',     display: 'dom13',   weight: 2, category: 'extended' },
  { name: 'min11',  display: 'min11',   weight: 2, category: 'extended' },
  { name: '7alt',   display: 'alt',     weight: 2, category: '7th' },
  // Tensions/alterations — a real, professional-level vocabulary rather
  // than just the base 7th/extended qualities above.
  { name: '7♭9',     display: '7♭9',     weight: 2, category: 'altered' },
  { name: '7♯9',     display: '7♯9',     weight: 2, category: 'altered' },
  { name: '7♯11',    display: '7♯11',    weight: 2, category: 'altered' },
  { name: '9♯11',    display: '9♯11',    weight: 2, category: 'extended' },
  { name: '13♯11',   display: '13♯11',   weight: 1, category: 'extended' },
  { name: '7♯5',     display: '7♯5',     weight: 1, category: 'altered' },
  { name: 'Maj7♯5',  display: 'maj7♯5',  weight: 1, category: '7th' },
  { name: 'Maj9♯11', display: 'maj9♯11', weight: 2, category: 'extended' },
  { name: 'm6/9',    display: 'm6/9',    weight: 2, category: 'extended' },
  { name: 'mMaj9',   display: 'mMaj9',   weight: 1, category: 'extended' },
  { name: 'ø9',      display: 'ø9',      weight: 1, category: 'extended' },
  { name: '9sus4',   display: '9sus4',   weight: 1, category: 'extended' },
  { name: '13sus4',  display: '13sus4',  weight: 1, category: 'extended' },
];

// Build weighted pool
function buildQualityPool() {
  const QUALITY_POOL = [];
  QUALITIES.forEach(q => {
    for (let i = 0; i < q.weight; i++) QUALITY_POOL.push(q);
  });
  return QUALITY_POOL;
}

function randomChord() {
  const QUALITY_POOL = buildQualityPool();
  if (QUALITY_POOL.length === 0) return { root: 0, quality: QUALITIES[0] }; // fallback
  const root = Math.floor(Math.random() * 12);
  const quality = QUALITY_POOL[Math.floor(Math.random() * QUALITY_POOL.length)];
  return { root, quality };
}

// ── Audio ─────────────────────────────────────────────────────────────
let audioCtx = null;
let reverbNode = null;
let activeOscillators = []; // track running oscs so we can stop them on chord change

function getCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    reverbNode = createReverb(audioCtx);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function createReverb(ctx) {
  const convolver = ctx.createConvolver();
  const sampleRate = ctx.sampleRate;
  const length = sampleRate * 2.5;
  const impulse = ctx.createBuffer(2, length, sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.2);
    }
  }
  convolver.buffer = impulse;
  const reverbGain = ctx.createGain();
  reverbGain.gain.value = 0.28;
  convolver.connect(reverbGain);
  reverbGain.connect(ctx.destination);
  return convolver;
}

const CHORD_VOICINGS = {
  'Maj':     [0, 4, 7, 12],
  'min':     [0, 3, 7, 12],
  '7':       [0, 4, 7, 10],
  'Maj7':    [0, 4, 7, 11],
  'min7':    [0, 3, 7, 10],
  'ø7':      [0, 3, 6, 10],
  'dim7':    [0, 3, 6, 9],
  'mMaj7':   [0, 3, 7, 11],
  'Maj7♯11': [0, 4, 6, 11],
  '9':       [0, 4, 7, 10, 14],
  'Maj9':    [0, 4, 7, 11, 14],
  'min9':    [0, 3, 7, 10, 14],
  'Aug':     [0, 4, 8, 12],
  'Sus4':    [0, 5, 7, 12],
  'Sus2':    [0, 2, 7, 12],
  '13':      [0, 4, 7, 10, 14, 21], // was identical to '9' (missing the 13th itself) — fixed
  'min11':   [0, 3, 7, 10, 17],
  '7alt':    [0, 4, 8, 10, 13],
  // Tensions/alterations
  '7♭9':     [0, 4, 7, 10, 13],
  '7♯9':     [0, 4, 7, 10, 15],
  '7♯11':    [0, 4, 7, 10, 18],
  '9♯11':    [0, 4, 7, 10, 14, 18],
  '13♯11':   [0, 4, 7, 10, 14, 18, 21],
  '7♯5':     [0, 4, 8, 10],
  'Maj7♯5':  [0, 4, 8, 11],
  'Maj9♯11': [0, 4, 7, 11, 14, 18],
  'm6/9':    [0, 3, 7, 9, 14],
  'mMaj9':   [0, 3, 7, 11, 14],
  'ø9':      [0, 3, 6, 10, 14],
  '9sus4':   [0, 5, 7, 10, 14],
  '13sus4':  [0, 5, 7, 10, 14, 21],
};

function midiToHz(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function stopAllOscillators() {
  activeOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
  activeOscillators = [];
}

// ── Chord voice ───────────────────────────────────────────────────────
// Hollow, reedy Wurlitzer-ish color. Connects into `dest` (that note's
// gain within the chord) and pushes its oscillators onto activeOscillators.
function playWurlyVoice(ctx, freq, startAt, stopAt, dest) {
  const osc = ctx.createOscillator();
  osc.type = 'square';
  osc.frequency.value = freq;
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = 850; // darker — less of the square wave's buzz
  filt.Q.value = 0.6; // less resonant peak at the cutoff, less "honky"
  const g = ctx.createGain();
  g.gain.value = 0.38;
  osc.connect(filt);
  filt.connect(g);
  g.connect(dest);
  osc.start(startAt); osc.stop(stopAt);
  activeOscillators.push(osc);

  const sub = ctx.createOscillator();
  sub.type = 'sine';
  sub.frequency.value = freq;
  const subGain = ctx.createGain();
  subGain.gain.value = 0.42; // more sub-sine relative to the square, for warmth
  sub.connect(subGain);
  subGain.connect(dest);
  sub.start(startAt); sub.stop(stopAt);
  activeOscillators.push(sub);
}

// Builds a compact, closed-position "right hand" voicing instead of a raw
// root-position stack. Raw interval stacking (root + 0,4,7,10,14...) spreads
// a 9th or 11th chord two octaves wide while the root stays anchored low —
// real comping never does this; it's exactly the "lower interval limit"
// problem (wide intervals read as muddy/wrong down low, so a player inverts
// instead of reaching for a two-octave handful). Each voice above the root
// is placed at the nearest octave above the previous one (closed position,
// centered on a comfortable comping register), then if the whole voicing
// still spans more than an octave and a half, the lowest voice folds up an
// octave — the actual inversion move a real player makes — until it fits.
const CHORD_VOICING_TARGET_CENTER = 60; // middle C — comping register, not down where the bass lives
const CHORD_VOICING_MAX_SPAN = 18; // an octave and a half

function buildCompactVoicing(rootIdx, qualityName) {
  const intervals = CHORD_VOICINGS[qualityName] || [0, 4, 7];
  const pitchClasses = intervals.map(i => ((rootIdx + i) % 12 + 12) % 12);

  let rootNote = pitchClasses[0];
  while (rootNote < CHORD_VOICING_TARGET_CENTER - 6) rootNote += 12;
  while (rootNote > CHORD_VOICING_TARGET_CENTER + 6) rootNote -= 12;

  const notes = [{ midi: rootNote, isRoot: true }];
  let cursor = rootNote;
  for (let k = 1; k < pitchClasses.length; k++) {
    let note = pitchClasses[k];
    while (note <= cursor) note += 12;
    notes.push({ midi: note, isRoot: false });
    cursor = note;
  }

  let guard = 0;
  while (guard < notes.length) {
    const midis = notes.map(n => n.midi);
    if (Math.max(...midis) - Math.min(...midis) <= CHORD_VOICING_MAX_SPAN) break;
    let lowestIdx = 0;
    for (let k = 1; k < notes.length; k++) if (notes[k].midi < notes[lowestIdx].midi) lowestIdx = k;
    notes[lowestIdx].midi += 12;
    guard++;
  }

  notes.sort((a, b) => a.midi - b.midi);
  return notes;
}

function playChord(rootIdx, qualityName, durationSec) {
  stopAllOscillators();
  const ctx = getCtx();
  const rootMidi = 48 + rootIdx; // C3 base — bass register only, unrelated to the chord voicing below

  const masterGain = ctx.createGain();
  const now = ctx.currentTime;
  // Fast attack so the chord change actually marks the beat, then a quick
  // decay down to a lower sustain — closer to how a real played chord
  // behaves (a transient followed by settling) than a flat pad plateau,
  // which reads as more natural and is easier to sit with for a long
  // practice session than a constant wall of sustained volume.
  const attackTime = 0.022;
  const decayTime = 0.11;
  const peakGain = 0.22;
  const sustainGain = 0.18;
  masterGain.gain.setValueAtTime(0, now);
  masterGain.gain.linearRampToValueAtTime(peakGain, now + attackTime);
  masterGain.gain.linearRampToValueAtTime(sustainGain, now + attackTime + decayTime);
  masterGain.gain.setValueAtTime(sustainGain, now + durationSec * 0.72);
  masterGain.gain.linearRampToValueAtTime(0, now + durationSec);
  masterGain.connect(ctx.destination);
  masterGain.connect(reverbNode);

  const voicing = buildCompactVoicing(rootIdx, qualityName);
  voicing.forEach((note, i) => {
    const freq = midiToHz(note.midi);
    const voiceGain = ctx.createGain();
    voiceGain.gain.value = note.isRoot ? 0.7 : 0.45;
    voiceGain.connect(masterGain);
    const startAt = now + i * 0.018; // very subtle strum, low to high
    const stopAt = now + durationSec + 0.05;

    playWurlyVoice(ctx, freq, startAt, stopAt, voiceGain);
  });

  // Bass note — same voice/tone as the chord itself, an octave below the
  // chord's own root register, hitting squarely on the downbeat (no strum
  // stagger) rather than blended in with the rest of the voicing.
  const bassGain = ctx.createGain();
  bassGain.gain.value = 0.8;
  bassGain.connect(masterGain);
  const bassFreq = midiToHz(rootMidi - 12);
  playWurlyVoice(ctx, bassFreq, now, now + durationSec + 0.05, bassGain);
}

function playMetronomeClick(isDownbeat = false) {
  const ctx = getCtx();
  const now = ctx.currentTime;
  
  // Create a short, loud click
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  
  osc.type = 'sine';
  osc.frequency.value = isDownbeat ? 1200 : 800; // Higher pitch for downbeat
  
  gain.gain.setValueAtTime(0.8, now); // Loud enough to hear over chords
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
  
  osc.connect(gain);
  gain.connect(ctx.destination);
  
  osc.start(now);
  osc.stop(now + 0.05);
}

// ── State ─────────────────────────────────────────────────────────────
let chordCount = 8;
let progression = [];
let isPlaying = false;
let currentBeat = -1;
let beatTimer = null;
let splitChordTimer = null; // second half of a split bar — separate from beatTimer so both get cleared on stop
let bpm = 60;
let savedProgressions = JSON.parse(localStorage.getItem('chordLooper_saved') || '[]');
let metronomeEnabled = false;
let metronomeBeat = 0; // Track quarter note within the bar
let useFlats = true; // note spelling for display only — root pitch classes are unaffected

function noteNames() { return useFlats ? ROOTS_FLAT : ROOTS; }

function setNoteSpelling(mode) {
  useFlats = (mode === 'flat');
  document.getElementById('spellFlatBtn').classList.toggle('active', useFlats);
  document.getElementById('spellSharpBtn').classList.toggle('active', !useFlats);
  updatePickerRootLabels();
  renderGrid();
  renderSaved();
  updatePickerPreview();
}

function setChordCount(n) {
  chordCount = n;
  document.getElementById('barSlider').value = n;
  document.getElementById('barCount').textContent = n;
  // Extend or trim progression
  while (progression.length < n) progression.push(randomChord());
  progression = progression.slice(0, n);
  renderGrid();
}

function setChordCountFromSlider(n) {
  n = parseInt(n);
  chordCount = n;
  document.getElementById('barCount').textContent = n;
  // Extend or trim progression
  while (progression.length < n) progression.push(randomChord());
  progression = progression.slice(0, n);
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('chordGrid');
  // Responsive columns
  const cols = chordCount <= 4 ? chordCount : chordCount <= 6 ? 3 : 4;
  grid.style.gridTemplateColumns = `repeat(${Math.min(cols, chordCount)}, 1fr)`;

  grid.innerHTML = '';
  progression.forEach((chord, i) => {
    const card = document.createElement('div');
    let classes = 'chord-card';
    if (i === currentBeat) classes += ' active';
    if (chord.second) classes += ' split';

    card.className = classes;
    if (chord.second) {
      card.innerHTML = `
        <span class="chord-number">${i + 1}</span>
        <div class="chord-half">
          <span class="chord-root">${noteNames()[chord.root]}</span>
          <span class="chord-quality">${chord.quality.display}</span>
        </div>
        <div class="chord-half">
          <span class="chord-root">${noteNames()[chord.second.root]}</span>
          <span class="chord-quality">${chord.second.quality.display}</span>
        </div>
      `;
    } else {
      card.innerHTML = `
        <span class="chord-number">${i + 1}</span>
        <span class="chord-root">${noteNames()[chord.root]}</span>
        <span class="chord-quality">${chord.quality.display}</span>
      `;
    }
    card.onclick = () => swapChord(i);

    grid.appendChild(card);
  });
}

function swapChord(index) {
  openPicker(index);
}

// ── Chord Picker ──────────────────────────────────────────────────────
let pickerIndex = null;
let pickerActiveHalf = 1; // 1 or 2 — which half of a split bar is being edited

// The chord object currently being edited — the bar itself, or its
// "second" chord when a split bar has half 2 active.
function pickerTargetChord() {
  if (pickerIndex === null) return null;
  const bar = progression[pickerIndex];
  return (pickerActiveHalf === 2 && bar.second) ? bar.second : bar;
}

function pickerSyncUI() {
  const chord = pickerTargetChord();
  if (!chord) return;
  document.querySelectorAll('.picker-root').forEach(btn => {
    btn.classList.toggle('selected', parseInt(btn.dataset.root) === chord.root);
  });
  document.querySelectorAll('.picker-quality').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.quality === chord.quality.name);
  });
  updatePickerPreview();
}

function pickerClearTypedInput() {
  const input = document.getElementById('pickerTypedChord');
  const statusEl = document.getElementById('pickerTypedStatus');
  if (input) input.value = '';
  if (statusEl) statusEl.style.display = 'none';
}

function openPicker(index) {
  pickerIndex = index;
  pickerActiveHalf = 1;
  const bar = progression[index];
  const modal = document.getElementById('chordPicker');

  document.getElementById('pickerSplitToggle').checked = !!bar.second;
  document.getElementById('pickerHalfTabs').style.display = bar.second ? 'flex' : 'none';
  document.getElementById('pickerHalfBtn1').classList.add('active');
  document.getElementById('pickerHalfBtn2').classList.remove('active');
  pickerClearTypedInput();

  pickerSyncUI();
  modal.classList.add('open');
}

function closePicker() {
  document.getElementById('chordPicker').classList.remove('open');
  pickerIndex = null;
}

function pickerToggleSplit(checked) {
  if (pickerIndex === null) return;
  const bar = progression[pickerIndex];
  if (checked) {
    // Start the second half as a copy of the first — a sensible default
    // rather than a jarring blank slot.
    bar.second = { root: bar.root, quality: bar.quality };
    document.getElementById('pickerHalfTabs').style.display = 'flex';
  } else {
    bar.second = null;
    document.getElementById('pickerHalfTabs').style.display = 'none';
    pickerActiveHalf = 1;
    document.getElementById('pickerHalfBtn1').classList.add('active');
    document.getElementById('pickerHalfBtn2').classList.remove('active');
  }
  pickerClearTypedInput();
  pickerSyncUI();
  renderGrid();
}

function pickerSetActiveHalf(half) {
  pickerActiveHalf = half;
  document.getElementById('pickerHalfBtn1').classList.toggle('active', half === 1);
  document.getElementById('pickerHalfBtn2').classList.toggle('active', half === 2);
  pickerClearTypedInput();
  pickerSyncUI();
}

function pickerSetRoot(rootIdx) {
  const chord = pickerTargetChord();
  if (!chord) return;
  chord.root = rootIdx;
  pickerSyncUI();
}

function pickerSetQuality(qualityName) {
  const quality = QUALITIES.find(q => q.name === qualityName);
  const chord = pickerTargetChord();
  if (!quality || !chord) return;
  chord.quality = quality;
  pickerSyncUI();
}

function pickerRandom() {
  if (pickerIndex === null) return;
  const rnd = randomChord();
  if (pickerActiveHalf === 2) {
    progression[pickerIndex].second = rnd;
  } else {
    const bar = progression[pickerIndex];
    progression[pickerIndex] = { ...rnd, second: bar.second || null };
  }
  pickerSyncUI();
}

// Like parseChordString, but reports exactly what it couldn't recognize
// instead of silently falling back to a dominant 7th — the typed-input box
// needs the user to know when something didn't land, not a quiet guess.
function pickerApplyTypedChord() {
  if (pickerIndex === null) return;
  const input = document.getElementById('pickerTypedChord');
  const statusEl = document.getElementById('pickerTypedStatus');
  const raw = (input.value || '').trim();
  if (!raw) return;

  const rootMatch = raw.match(/^([A-Ga-g][b#]?)/);
  if (!rootMatch) {
    statusEl.textContent = `Couldn't find a root note in "${raw}" — start with a letter A-G, optionally followed by b or #.`;
    statusEl.style.display = 'block';
    return;
  }
  const rootStr = rootMatch[1][0].toUpperCase() + rootMatch[1].slice(1);
  const rootIdx = CHORD_ROOT_MAP[rootStr];
  if (rootIdx === undefined) {
    statusEl.textContent = `"${rootStr}" isn't a note I recognize.`;
    statusEl.style.display = 'block';
    return;
  }

  let qualStr = raw.slice(rootMatch[1].length).trim();
  if (qualStr === '' || qualStr.toLowerCase() === 'maj' || qualStr === 'M') qualStr = 'Maj';
  const qualName = CHORD_QUALITY_MAP[qualStr] || CHORD_QUALITY_MAP[qualStr.toLowerCase()];
  const quality = QUALITIES.find(q => q.name === qualName);
  if (!quality) {
    statusEl.textContent = `Don't recognize the quality "${qualStr}" — try things like maj7, m9, 7#11, m6/9, dim7, sus4.`;
    statusEl.style.display = 'block';
    return;
  }

  const parsed = { root: rootIdx, quality };
  if (pickerActiveHalf === 2) {
    progression[pickerIndex].second = parsed;
  } else {
    const bar = progression[pickerIndex];
    progression[pickerIndex] = { ...parsed, second: bar.second || null };
  }
  statusEl.style.display = 'none';
  input.value = '';
  pickerSyncUI();
}

function updatePickerPreview() {
  if (pickerIndex === null) return;
  const bar = progression[pickerIndex];
  const mainLabel = `${noteNames()[bar.root]} ${bar.quality.display}`;
  if (bar.second) {
    const secondLabel = `${noteNames()[bar.second.root]} ${bar.second.quality.display}`;
    document.getElementById('pickerPreview').textContent = `${mainLabel} | ${secondLabel}`;
  } else {
    document.getElementById('pickerPreview').textContent = mainLabel;
  }
  renderGrid();
}

const TEMPO_MIN = 20;
const TEMPO_MAX = 320;

function updateTempoFromInput(input) {
  let val = parseInt(input.value);
  if (!Number.isFinite(val)) return;
  val = Math.max(TEMPO_MIN, Math.min(TEMPO_MAX, val));
  bpm = val;
  input.value = val;
  if (isPlaying) {
    clearTimeout(beatTimer);
    // Let current chord finish naturally — just update bpm for next advance
    // Actually restart from next beat immediately
    isPlaying = false;
    startLoop();
  }
}

function stepTempo(delta) {
  const input = document.getElementById('tempoInput');
  const val = (parseInt(input.value) || bpm) + delta;
  input.value = Math.max(TEMPO_MIN, Math.min(TEMPO_MAX, val));
  updateTempoFromInput(input);
}

function toggleMetronome() {
  metronomeEnabled = !metronomeEnabled;
  const btn = document.getElementById('btnMetronome');
  btn.classList.toggle('active', metronomeEnabled);
  
  // If currently playing, sync metronome with current position
  if (isPlaying && metronomeEnabled) {
    const msPerBeat = (60 / bpm) * 1000;
    scheduleMetronomeBeats(msPerBeat);
  } else if (!metronomeEnabled) {
    stopMetronomeClicks();
  }
}

function stopMetronomeClicks() {
  if (window.metronomeTimer) {
    clearTimeout(window.metronomeTimer);
    window.metronomeTimer = null;
  }
  if (window.metronomeTimers) {
    window.metronomeTimers.forEach(timer => clearTimeout(timer));
    window.metronomeTimers = [];
  }
}

function togglePlay() {
  isPlaying ? stopLoop() : startLoop();
}

function startLoop() {
  isPlaying = true;
  const btn = document.getElementById('btnPlayStop');
  btn.textContent = '■';
  btn.classList.add('playing');

  const msPerBeat = (60 / bpm) * 1000;
  const msPerChord = msPerBeat * 4; // 4 beats per chord = one full bar
  const secPerChord = msPerChord / 1000;

  // Store the time when each chord starts for metronome sync
  let chordStartTime = Date.now();

  function advance() {
    currentBeat = currentBeat + 1;
    // Loop the whole progression
    if (currentBeat > chordCount - 1) {
      currentBeat = 0;
    }
    renderGrid();
    const chord = progression[currentBeat];

    // Metronome always ticks a normal 4-beat bar regardless of a split —
    // only the chord sound changes mid-bar, the pulse doesn't.
    chordStartTime = Date.now();
    if (metronomeEnabled) {
      stopMetronomeClicks();
      scheduleMetronomeBeats(msPerBeat);
    }

    clearTimeout(splitChordTimer);
    if (chord.second) {
      const halfMs = msPerChord / 2;
      playChord(chord.root, chord.quality.name, (halfMs / 1000) * 0.95);
      splitChordTimer = setTimeout(() => {
        playChord(chord.second.root, chord.second.quality.name, (halfMs / 1000) * 0.95);
      }, halfMs);
    } else {
      playChord(chord.root, chord.quality.name, secPerChord * 0.95);
    }

    beatTimer = setTimeout(advance, msPerChord);
  }

  currentBeat = -1;
  advance();
}

function scheduleMetronomeBeats(msPerBeat) {
  if (!metronomeEnabled || !isPlaying) return;
  
  // Schedule 4 beats (one bar)
  for (let beat = 0; beat < 4; beat++) {
    const delay = beat * msPerBeat;
    const timer = setTimeout(() => {
      if (!isPlaying || !metronomeEnabled) return;
      playMetronomeClick(beat === 0); // Downbeat on beat 0
    }, delay);
    
    // Store the timer so we can clear it
    if (!window.metronomeTimers) window.metronomeTimers = [];
    window.metronomeTimers.push(timer);
  }
}

function stopLoop() {
  isPlaying = false;
  clearTimeout(beatTimer);
  beatTimer = null;
  clearTimeout(splitChordTimer);
  splitChordTimer = null;
  stopMetronomeClicks();
  currentBeat = -1;
  const btn = document.getElementById('btnPlayStop');
  btn.textContent = '▶';
  btn.classList.remove('playing');
  renderGrid();
}

// SAVE
function saveProgression() {
  const entry = {
    id: Date.now(),
    chords: progression.map(c => ({ root: c.root, quality: c.quality.name })),
    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  };
  savedProgressions.unshift(entry);
  localStorage.setItem('chordLooper_saved', JSON.stringify(savedProgressions));
  renderSaved();

  const flash = document.getElementById('saveFlash');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 1500);
}

function loadProgression(id) {
  const entry = savedProgressions.find(e => e.id === id);
  if (!entry) return;
  chordCount = entry.chords.length;
  progression = entry.chords.map(c => ({
    root: c.root,
    quality: QUALITIES.find(q => q.name === c.quality) || QUALITIES[0]
  }));
  // Update count buttons
  document.querySelectorAll('.count-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.n) === chordCount);
  });
  renderGrid();
}

function deleteProgression(id) {
  savedProgressions = savedProgressions.filter(e => e.id !== id);
  localStorage.setItem('chordLooper_saved', JSON.stringify(savedProgressions));
  renderSaved();
}

function clearAll() {
  if (savedProgressions.length === 0) return;
  savedProgressions = [];
  localStorage.setItem('chordLooper_saved', JSON.stringify(savedProgressions));
  renderSaved();
}

function renderSaved() {
  const container = document.getElementById('savedList');
  if (!container) return; // saved-progressions UI isn't in the DOM (yet)
  if (savedProgressions.length === 0) {
    container.innerHTML = '<p class="saved-empty">Nothing saved yet.</p>';
    return;
  }
  container.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'saved-list';
  savedProgressions.forEach(entry => {
    const item = document.createElement('div');
    item.className = 'saved-item';
    const chordsHtml = entry.chords.map(c => {
      const q = QUALITIES.find(q => q.name === c.quality);
      const display = q ? q.display : c.quality;
      return `<span class="saved-chord-pill"><span class="root">${noteNames()[c.root]}</span><span class="quality"> ${display}</span></span>`;
    }).join('');
    item.innerHTML = `
      <div style="flex:1">
        <div class="saved-chords">${chordsHtml}</div>
        <div class="saved-timestamp">${entry.timestamp}</div>
      </div>
      <div class="saved-item-actions">
        <button class="btn-load" onclick="loadProgression(${entry.id})">Load</button>
        <button class="btn-delete" onclick="deleteProgression(${entry.id})">✕</button>
      </div>
    `;
    list.appendChild(item);
  });
  container.appendChild(list);
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('chordPicker')) closePicker();
}

function updatePickerRootLabels() {
  document.querySelectorAll('.picker-root').forEach(btn => {
    btn.textContent = noteNames()[parseInt(btn.dataset.root)];
  });
}

function initPicker() {
  // Build root buttons
  const rootsEl = document.getElementById('pickerRoots');
  ROOTS.forEach((name, i) => {
    const btn = document.createElement('button');
    btn.className = 'picker-root';
    btn.dataset.root = i;
    btn.textContent = noteNames()[i];
    btn.onclick = () => pickerSetRoot(i);
    rootsEl.appendChild(btn);
  });

  // Build quality buttons
  const qualEl = document.getElementById('pickerQualities');
  QUALITIES.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'picker-quality';
    btn.dataset.quality = q.name;
    btn.textContent = q.display;
    btn.onclick = () => pickerSetQuality(q.name);
    qualEl.appendChild(btn);
  });
}

// Init
progression = Array.from({ length: chordCount }, randomChord);
renderGrid();
renderSaved();
initPicker();
document.getElementById('barSlider').value = chordCount;
document.getElementById('barCount').textContent = chordCount;

// ── Chord-list string parser ─────────────────────────────────────────────
// Shared by the URL-param loader below and the AI progression generator —
// parses a comma-separated shorthand like "Cm7,F7,Bbmaj7,Ebmaj7" into a
// real progression array. Root name to index mapping:
const CHORD_ROOT_MAP = {
    'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3,
    'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8,
    'Ab': 8, 'A': 9, 'A#': 10, 'Bb': 10, 'B': 11
};

// Quality string to QUALITIES name mapping
const CHORD_QUALITY_MAP = {
    'maj': 'Maj', 'major': 'Maj', 'M': 'Maj',
    'min': 'min', 'minor': 'min', 'm': 'min',
    '7': '7', 'dom7': '7', 'dominant': '7',
    'maj7': 'Maj7', 'M7': 'Maj7',
    'min7': 'min7', 'm7': 'min7',
    'dim7': 'dim7', 'o7': 'dim7',
    'ø7': 'ø7', 'half-dim': 'ø7', 'm7b5': 'ø7',
    'mmaj7': 'mMaj7', 'mM7': 'mMaj7',
    'maj7#11': 'Maj7♯11', 'Maj7#11': 'Maj7♯11',
    '9': '9', 'dom9': '9',
    'maj9': 'Maj9', 'M9': 'Maj9',
    'min9': 'min9', 'm9': 'min9',
    'aug': 'Aug', '+': 'Aug',
    'sus4': 'Sus4', 'sus': 'Sus4',
    'sus2': 'Sus2',
    '13': '13', 'dom13': '13',
    'min11': 'min11', 'm11': 'min11',
    'alt': '7alt', '7alt': '7alt',
    // Tensions/alterations
    '7b9': '7♭9',
    '7#9': '7♯9',
    '7#11': '7♯11',
    '9#11': '9♯11',
    '13#11': '13♯11',
    '7#5': '7♯5', '7+5': '7♯5',
    'maj7#5': 'Maj7♯5', 'M7#5': 'Maj7♯5',
    'maj9#11': 'Maj9♯11', 'M9#11': 'Maj9♯11',
    'm6/9': 'm6/9', 'min6/9': 'm6/9', 'm69': 'm6/9',
    'mmaj9': 'mMaj9', 'mM9': 'mMaj9',
    'm9b5': 'ø9', 'ø9': 'ø9', 'halfdim9': 'ø9',
    '9sus4': '9sus4', '9sus': '9sus4',
    '13sus4': '13sus4', '13sus': '13sus4'
};

function parseChordString(str) {
    // Try to parse root + quality from a chord string like Cm7, F7, Bbmaj7
    // First find root (1-2 chars + optional b/#)
    const rootMatch = str.match(/^([A-G][b#]?)/);
    if (!rootMatch) return null;
    const rootStr = rootMatch[1];
    const rootIdx = CHORD_ROOT_MAP[rootStr];
    if (rootIdx === undefined) return null;

    // Rest is quality
    let qualStr = str.slice(rootStr.length).trim();
    if (qualStr === '' || qualStr.toLowerCase() === 'maj' || qualStr === 'M') qualStr = 'Maj';

    // Look up quality
    const qualName = CHORD_QUALITY_MAP[qualStr] || CHORD_QUALITY_MAP[qualStr.toLowerCase()];
    const quality = QUALITIES.find(q => q.name === qualName);
    if (!quality) {
        // Default to dom7 if unrecognized
        return { root: rootIdx, quality: QUALITIES.find(q => q.name === '7') || QUALITIES[0] };
    }
    return { root: rootIdx, quality };
}

// Parses a full comma-separated chord list string, returning a progression
// array (empty if nothing valid was found). A bar can hold two chords by
// separating them with "|", e.g. "Dm7,G7|Cmaj7,Fmaj7" — bar 2 splits into
// G7 for the first half and Cmaj7 for the second.
function parseChordListString(chordsStr) {
    const barStrings = (chordsStr || '').split(',').map(s => s.trim()).filter(Boolean);
    return barStrings.map(barStr => {
        if (barStr.includes('|')) {
            const [firstStr, secondStr] = barStr.split('|').map(s => s.trim());
            const first = parseChordString(firstStr);
            const second = secondStr ? parseChordString(secondStr) : null;
            if (!first) return null;
            return second ? { ...first, second } : first;
        }
        return parseChordString(barStr);
    }).filter(Boolean);
}

// Applies a parsed progression to the app state and re-renders.
function applyProgression(parsed) {
    if (!parsed.length) return false;
    chordCount = parsed.length;
    progression = parsed;
    const barSlider = document.getElementById('barSlider');
    const barCount = document.getElementById('barCount');
    if (barSlider) barSlider.value = chordCount;
    if (barCount) barCount.textContent = chordCount;
    renderGrid();
    return true;
}

// ── URL Parameter Loader ──────────────────────────────────────────────────
(function applyUrlParams() {
    const params = new URLSearchParams(window.location.search);

    // BPM
    const bpmParam = params.get('bpm');
    if (bpmParam) {
        bpm = Math.max(TEMPO_MIN, Math.min(TEMPO_MAX, parseInt(bpmParam)));
        const tempoInput = document.getElementById('tempoInput');
        if (tempoInput) tempoInput.value = bpm;
    }

    // Bars
    const barsParam = params.get('bars');
    if (barsParam) {
        const n = parseInt(barsParam);
        chordCount = n;
        const barSlider = document.getElementById('barSlider');
        const barCount = document.getElementById('barCount');
        if (barSlider) barSlider.value = n;
        if (barCount) barCount.textContent = n;
    }

    // Chords — format: Cm7,F7,Bbmaj7,Ebmaj7
    const chordsParam = params.get('chords');
    if (chordsParam) {
        applyProgression(parseChordListString(chordsParam));
    }
})();

// ── AI Progression Generator ──────────────────────────────────────────────
const CHORD_LOOPER_WORKER_URL = 'https://practice-lab-proxy.gregdallasmusic.workers.dev';

async function generateProgressionFromPrompt() {
    const input = document.getElementById('aiProgressionPrompt');
    const btn = document.getElementById('aiProgressionBtn');
    const statusEl = document.getElementById('aiProgressionStatus');
    const promptText = (input.value || '').trim();
    if (!promptText) {
        statusEl.textContent = 'Type what kind of progression you want first.';
        statusEl.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Generating…';
    statusEl.style.display = 'none';

    try {
        const res = await fetch(CHORD_LOOPER_WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'generateChordProgression', prompt: promptText }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Something went wrong.');

        const parsed = parseChordListString(data.result.chords);
        if (!parsed.length) throw new Error('Could not parse a progression from the response.');
        applyProgression(parsed);

        if (data.result.bpm) {
            bpm = data.result.bpm;
            const tempoInput = document.getElementById('tempoInput');
            if (tempoInput) tempoInput.value = bpm;
        }
        statusEl.textContent = '';
        statusEl.style.display = 'none';
    } catch (e) {
        statusEl.textContent = "Couldn't generate that — try again in a moment.";
        statusEl.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Generate';
    }
}
